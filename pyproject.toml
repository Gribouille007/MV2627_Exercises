[project]
name = "mechanical-vibrations-2026-2027"
version = "0.1.0"
description = "Repository containing jupyter notebooks for the exercise sessions of the Mechanical Vibrations 2026-2027 course"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Yacine Bel-Hadj", email = "yacine.bel-hadj@vub.be" },
    { name = "Wout Weijtjens", email = "wout.weijtjens@vub.be" },
    { name = "Abdulelah Al-Ghuwaidi", email = "Abdulelah.Al-Ghuwaidi@vub.be" },
]
license-files = ["LICENSE"]

dependencies = [
    "h5py>=3.16.0",
    "ipykernel",
    "jupyterlab",
    "numpy>=2,<2.5",
    "pandas>=3.0.5",
    "polars>=1.44.0",
    "scipy",
    "torch",
    "pytest",
    "pyarrow<25",
    "dynaresp>=0.5.1",
    "py-opensdbrussels2026>=0.1.0",
    "ipympl>=0.10.0",
    "ipywidgets>=8.1.9",
    "jupyterlab-widgets>=3.0.17"
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = ["pytest"]

